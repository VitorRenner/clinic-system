# Google Cloud Build → Artifact Registry → Cloud Run
#
# Uso (na raiz do projeto):
#   gcloud builds submit --config cloudbuild.yaml
#
# Trocar região/nomes:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_REGION=southamerica-east1,_SERVICE=odontocare-web,_REPO=odontocare
#
# Pré-requisitos e passo a passo: docs/DEPLOY_GCP.md

substitutions:
  _REGION: southamerica-east1      # São Paulo
  _REPO: odontocare                # repositório no Artifact Registry
  _SERVICE: odontocare-web         # nome do serviço no Cloud Run

steps:
  # 1. Build da imagem (usa o Dockerfile da raiz)
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  # 2. Envia para o Artifact Registry
  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}"]

  # 3. Publica no Cloud Run
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --port=8080
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=2
      - --memory=256Mi
      - --cpu=1

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID

options:
  logging: CLOUD_LOGGING_ONLY
